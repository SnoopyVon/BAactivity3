<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="registerstyle.css">
  </head>

  <body class="body">
    <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100">

      <div class="card shadow register-card p-0" style="max-width: 850px; width: 100%;">
        <div class="row g-0">
          <!--Left Side-->
          <div class="col-md-5 left-side d-flex flex-column justify-content-center align-items-center text-white p-4">
            <h2 class="display-6 fw-bold mb-3">Get Started</h2>
            <p class="lead fw-light mb-3">Already have an account?</p>
            <a href="loginpage.html" class="btn btn-outline-light rounded-pill px-4 fw-semibold">Log in</a>
          </div>
          <!--Right Side-->
          <div class="col-md-7 bg-white p-4 p-md-5">
            <h2 class="text-center mb-4">Create New Account</h2>
            <form id="registrationForm" autocomplete="off">
              <div class="mb-3">
                <label for="name" class="form-label">Name <i class="bi bi-person-vcard"></i></label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Full name">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email Address <i class="bi bi-at"></i></label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Email Address">
              </div>
              <div class="mb-3">
                <label for="username" class="form-label">Username <i class="bi bi-person"></i></label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="new-username" placeholder="Username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password <i class="bi bi-lock"></i></label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" placeholder="Password">
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password <i class="bi bi-lock"></i></label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Confirm your password">
              </div>
              <div id="registrationMessage" class="alert d-none" role="alert"></div>
              <div class="col-auto">
                <button type="submit" class="btn btn-primary mb-3 w-100 rounded-pill px-4">Sign Up</button>
              </div>
            </form>
          </div>

        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
    <script>
      $(function () {
        $("#username, #password, #confirmPassword").val("");

        $("#registrationForm").validate({
          rules: {
            name: { required: true, minlength: 2 },
            email: { required: true, email: true },
            username: { required: true, minlength: 3 },
            password: { required: true, minlength: 5 },
            confirmPassword: { required: true, equalTo: "#password" }
          },
          messages: {
            name: {
              required: "Please enter your name.",
              minlength: "Your name must be at least 2 characters long."
            },
            email: {
              required: "Please enter your email address.",
              email: "Please enter a valid email address."
            },
            username: {
              required: "Please choose a username.",
              minlength: "Your username must be at least 3 characters long."
            },
            password: {
              required: "Please create a password.",
              minlength: "Your password must be at least 5 characters long."
            },
            confirmPassword: {
              required: "Please confirm your password.",
              equalTo: "Passwords do not match."
            }
          },
          submitHandler: function (form) {
            localStorage.setItem("registeredUsername", $("#username").val());
            localStorage.setItem("registeredPassword", $("#password").val());
            $("#registrationMessage")
              .removeClass("d-none alert-danger")
              .addClass("alert-success")
              .text("Registration successful. You can now log in.");
            form.reset();
            return false;
          }
        });
      });
    </script>
  </body>
</html>
