<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="registerstyle.css">
  </head>

  <body class="body">
    <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100">

      <div class="card shadow register-card p-0" style="max-width: 850px; width: 100%;">
        <div class="row g-0">
          <!--Left Side-->
          <div class="col-md-5 left-side d-flex flex-column justify-content-center align-items-center text-white p-4">
            <h2 class="display-6 fw-bold mb-3">Get Started</h2>
            <p class="lead fw-light mb-3">Already have an account?</p>
            <a href="loginpage.html" class="btn btn-outline-light rounded-pill px-4 fw-semibold">Log in</a>
          </div>
          <!--Right Side-->
          <div class="col-md-7 bg-white p-4 p-md-5">
            <h2 class="text-center mb-4">Create New Account</h2>
            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Email Address <i class="bi bi-at"></i></label>
                <input type="email" class="form-control" id="email" placeholder="Email Address">
              </div>
              <div class="mb-3">
                <label for="username" class="form-label">Username <i class="bi bi-person"></i></label>
                <input type="text" class="form-control" id="username" placeholder="Username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password <i class="bi bi-lock"></i></label>
                <input type="password" class="form-control" id="password" placeholder="Password">
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password <i class="bi bi-lock"></i></label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
              </div>
              <div class="col-auto">
                <button type="submit" class="btn btn-primary mb-3 w-100 rounded-pill px-4">Sign Up</button>
              </div>
            </form>
          </div>

        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
