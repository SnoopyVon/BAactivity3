<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="loginstyle.css">
  </head>

  <body>
    <div class="container-fluid min-vh-100">
      <div class="row min-vh-100">

        <!-- Image panel -->
        <div class="col-lg-8 h-100 d-none d-lg-block">
          <div class="row h-100">
            <div class="col-4 image-col"></div>
            <div class="col-4 image-col"></div>
            <div class="col-4 image-col"></div>
          </div>
        </div>

        <!-- Login panel -->
        <div class="col-lg-4 login-panel d-flex flex-column justify-content-center align-items-center p-4 py-5">
          <div class="logo">
            <h1>A</h1>
            <p>ARCHITECTS</p>
          </div>

          <div class="mb-3 greeting">
            <h2>Welcome back</h2>
            <p class="subtext">Sign in to your studio account</p>
          </div>

          <form class="w-100 form-max-width">
            <div class="mb-3">
              <label for="username" class="form-label">Username <i class="bi bi-person"></i> </label>
              <input type="text" class="form-control" id="username" placeholder="Enter Username">
            </div>
            <div class="mb-2">
              <label for="password" class="form-label">Password <i class="bi bi-lock"></i></label>
              <input type="password" class="form-control" id="password" placeholder="Enter Password">
            </div>
            <div class="text-start mb-4">
              <a href="#" class="text-muted small text-decoration-none">Forgot Password</a>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-dark rounded-pill py-2 fw-semibold">LOGIN</button>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="small text-muted">Don't have an account? <a href="registerpage.html" class="text-decoration-none">Sign Up</a></p>
          </div>

          <div class="text-center">
            <blockquote class="quote-text">
              "Architecture is the thoughtful making of space for human experience."
            </blockquote>
            <p class="quote-author">— Louis I. Kahn</p>
          </div>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
