<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="loginstyle.css">
  </head>

  <body>
    <div class="container-fluid min-vh-100">
      <div class="row min-vh-100">

        <!-- Image panel -->
        <div class="col-lg-8 h-100 d-none d-lg-block">
          <div class="row h-100">
            <div class="col-4 image-col"></div>
            <div class="col-4 image-col"></div>
            <div class="col-4 image-col"></div>
          </div>
        </div>

        <!-- Login panel -->
        <div class="col-lg-4 login-panel d-flex flex-column justify-content-center align-items-center p-4 py-5">
          <div class="logo">
            <h1>A</h1>
            <p>ARCHITECTS</p>
          </div>

          <div class="mb-3 greeting">
            <h2>Welcome back</h2>
            <p class="subtext">Sign in to your studio account</p>
          </div>

          <form id="loginForm" class="w-100 form-max-width">
            <div class="mb-3">
              <label for="username" class="form-label">Username <i class="bi bi-person"></i> </label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Enter Username">
            </div>
            <div class="mb-2">
              <label for="password" class="form-label">Password <i class="bi bi-lock"></i></label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password">
            </div>
            <div id="loginMessage" class="alert d-none" role="alert"></div>
            <div class="text-start mb-4">
              <a href="#" class="text-muted small text-decoration-none">Forgot Password</a>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-dark rounded-pill py-2 fw-semibold">LOGIN</button>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="small text-muted">Don't have an account? <a href="registerpage.html" class="text-decoration-none">Sign Up</a></p>
          </div>

          <div class="text-center">
            <blockquote class="quote-text">
              "Architecture is the thoughtful making of space for human experience."
            </blockquote>
            <p class="quote-author">— Louis I. Kahn</p>
          </div>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
    <script>
      $(function () {
        const validUsername = "admin";
        const validPassword = "12345";
        const maxAttempts = 5;
        let failedAttempts = Number(sessionStorage.getItem("failedLoginAttempts")) || 0;
        const $form = $("#loginForm");
        const $button = $form.find("button[type='submit']");
        const $message = $("#loginMessage");

        function showMessage(text, type) {
          $message.removeClass("d-none alert-danger alert-success")
            .addClass("alert-" + type)
            .text(text);
        }

        function lockLogin() {
          $button.prop("disabled", true);
          showMessage("Too many failed attempts. Login is locked for this session.", "danger");
        }

        if (failedAttempts >= maxAttempts) {
          lockLogin();
        }

        $form.validate({
          rules: {
            username: { required: true },
            password: { required: true }
          },
          messages: {
            username: { required: "Please enter your username." },
            password: { required: "Please enter your password." }
          },
          submitHandler: function () {
            if (failedAttempts >= maxAttempts) {
              lockLogin();
              return false;
            }

            const registeredUsername = localStorage.getItem("registeredUsername");
            const registeredPassword = localStorage.getItem("registeredPassword");
            const enteredUsername = $("#username").val();
            const enteredPassword = $("#password").val();
            const validCredentials = enteredUsername === validUsername && enteredPassword === validPassword;
            const registeredCredentials = enteredUsername === registeredUsername && enteredPassword === registeredPassword;

            if (validCredentials || registeredCredentials) {
              sessionStorage.setItem("loggedIn", "true");
              sessionStorage.setItem("loggedInUsername", enteredUsername);
              sessionStorage.removeItem("failedLoginAttempts");
              window.location.href = "landingpage.html";
              return false;
            }

            failedAttempts += 1;
            sessionStorage.setItem("failedLoginAttempts", failedAttempts);
            if (failedAttempts >= maxAttempts) {
              lockLogin();
            } else {
              showMessage("Incorrect username or password. " + (maxAttempts - failedAttempts) + " attempt(s) remaining.", "danger");
            }
            return false;
          }
        });
      });
    </script>
  </body>
</html>
